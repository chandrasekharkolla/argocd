apiVersion: v1
kind: ConfigMap
metadata:
  name: substrate-postgres-init
  namespace: ate-system
data:
  init.sql: |
    CREATE ROLE substrate_owner WITH LOGIN PASSWORD 'substrate_owner_pass';
    CREATE ROLE substrate_readwrite WITH LOGIN PASSWORD 'substrate_rw_pass';
    CREATE SCHEMA IF NOT EXISTS substrate AUTHORIZATION substrate_owner;
    GRANT USAGE ON SCHEMA substrate TO substrate_readwrite;
    ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO substrate_readwrite;
    ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
      GRANT USAGE, SELECT ON SEQUENCES TO substrate_readwrite;
---
apiVersion: v1
kind: Secret
metadata:
  name: substrate-postgres-owner
  namespace: ate-system
type: Opaque
stringData:
  ownerConnectionString: "postgresql://substrate_owner:substrate_owner_pass@substrate-postgres.ate-system.svc.cluster.local:5432/substrate?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: substrate-postgres-readwrite
  namespace: ate-system
type: Opaque
stringData:
  readWriteConnectionString: "postgresql://substrate_readwrite:substrate_rw_pass@substrate-postgres.ate-system.svc.cluster.local:5432/substrate?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-postgres
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: substrate-postgres
  template:
    metadata:
      labels:
        app: substrate-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: substrate
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-sql
          configMap:
            name: substrate-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: substrate-postgres
  namespace: ate-system
spec:
  selector:
    app: substrate-postgres
  ports:
    - port: 5432
      targetPort: 5432
