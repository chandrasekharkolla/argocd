apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/chandrasekharkolla/argocd.git
    targetRevision: main
    path: infra/argocd/manifests/substrate-postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
